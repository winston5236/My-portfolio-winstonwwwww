<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Focus Wheel Portfolio & Archive</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --bg: #0a0b0d;
      --surface: #121316;
      --surface-2: #1a1c23;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --line: #2d313e;
      --accent-web: #3b82f6;
      --accent-3d: #8b5cf6;
      --accent-video: #ec4899;
      --accent-photo: #10b981;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }

    /* Animations */
    @keyframes pop {
      0% { transform: scale(0.95); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pop {
      animation: pop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- DEFAULT DATA ---
    const DEFAULT_CATEGORIES = [
      {
        id: "cat_1",
        label: "Web & Software",
        short: "WEB",
        description: "Interactive web applications, design systems, and frontend architecture.",
        color: "#3b82f6"
      },
      {
        id: "cat_2",
        label: "Product & Industrial",
        short: "PROD",
        description: "Physical product forms, ergonomic studies, and 3D CAD modeling.",
        color: "#f97316"
      },
      {
        id: "cat_3",
        label: "Photography",
        short: "PHOTO",
        description: "Architectural, street, and landscape imagery on medium format film.",
        color: "#10b981"
      },
      {
        id: "cat_4",
        label: "Motion & Video",
        short: "MOTION",
        description: "Kinetic art, physical inertia studies, and short form cinematography.",
        color: "#ec4899"
      },
      {
        id: "cat_5",
        label: "Spatial & Sculpture",
        short: "3D",
        description: "Parametric ceramic 3D printing and organic lattice structural studies.",
        color: "#8b5cf6"
      }
    ];

    const DEFAULT_PROJECTS = [
      {
        id: "001",
        categoryId: "cat_1",
        title: "Daily Journal App",
        type: "web",
        tags: ["react", "typescript", "tailwind"],
        desc: "A minimal daily-journaling web application with mood tracking, typography presets, and weekly recaps.",
        cover: "https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=1000&q=80",
        link: "https://example.com",
        processImages: [
          "https://images.unsplash.com/photo-1531403009284-440f080d1e12?auto=format&fit=crop&w=1000&q=80",
          "https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?auto=format&fit=crop&w=1000&q=80"
        ],
        finalImages: [
          "https://images.unsplash.com/photo-1517842645767-c639042777db?auto=format&fit=crop&w=1000&q=80",
          "https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=1000&q=80"
        ],
        videos: [
          "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4"
        ],
        models: []
      },
      {
        id: "002",
        categoryId: "cat_2",
        title: "Ergonomic Lounge Chair",
        type: "3d",
        tags: ["cad", "rhino", "rendering"],
        desc: "A form study for an ergonomic lounge chair, modeled with an emphasis on a single continuous curved shell.",
        cover: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=1000&q=80",
        link: "https://sketchfab.com",
        processImages: [
          "https://images.unsplash.com/photo-1581092580497-e0d23cbdf1dc?auto=format&fit=crop&w=1000&q=80"
        ],
        finalImages: [
          "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=1000&q=80"
        ],
        videos: [
          "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
        ],
        models: []
      }
    ];

    // --- MAIN APP COMPONENT ---
    function App() {
      const [categories, setCategories] = useState(() => {
        const saved = localStorage.getItem("portfolio_categories");
        return saved ? JSON.parse(saved) : DEFAULT_CATEGORIES;
      });

      const [projects, setProjects] = useState(() => {
        const saved = localStorage.getItem("portfolio_projects");
        return saved ? JSON.parse(saved) : DEFAULT_PROJECTS;
      });

      const [activeCategory, setActiveCategory] = useState(null);
      const [selectedProject, setSelectedProject] = useState(null);
      const [focusedIndex, setFocusedIndex] = useState(0);

      useEffect(() => {
        localStorage.setItem("portfolio_categories", JSON.stringify(categories));
      }, [categories]);

      useEffect(() => {
        localStorage.setItem("portfolio_projects", JSON.stringify(projects));
      }, [projects]);

      return (
        <div className="min-h-screen bg-[var(--bg)] text-[var(--text)] flex flex-col">
          {/* Header */}
          <header className="px-6 py-4 border-b border-[var(--line)] flex items-center justify-between">
            <h1 className="text-xl font-bold tracking-wider font-mono cursor-pointer" onClick={() => setActiveCategory(null)}>
              FOCUS // ARCHIVE
            </h1>
            <div className="text-xs font-mono text-[var(--muted)]">
              {categories.length} SECTIONS ACTIVE
            </div>
          </header>

          {/* Main Stage */}
          <main className="flex-1 p-6">
            {!activeCategory ? (
              <div className="max-w-4xl mx-auto py-12 text-center">
                <h2 className="text-3xl font-bold mb-4 font-display">Interactive Wheel Portfolio</h2>
                <p className="text-[var(--muted)] mb-8 max-w-xl mx-auto">
                  Click on any category slice or label below to enter its dedicated project archive.
                </p>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                  {categories.map((cat) => (
                    <div
                      key={cat.id}
                      onClick={() => setActiveCategory(cat)}
                      className="p-6 rounded-lg border border-[var(--line)] bg-[var(--surface)] hover:border-[#ffffff]/60 cursor-pointer transition-all text-left group"
                    >
                      <div className="flex items-center gap-2 mb-2">
                        <span className="w-3 h-3 rounded-full" style={{ backgroundColor: cat.color }} />
                        <span className="text-xs font-mono font-bold text-[var(--muted)]">{cat.short}</span>
                      </div>
                      <h3 className="font-bold text-lg mb-1 group-hover:text-blue-400">{cat.label}</h3>
                      <p className="text-xs text-[var(--muted)]">{cat.description}</p>
                    </div>
                  ))}
                </div>
              </div>
            ) : (
              <div>
                <button
                  onClick={() => setActiveCategory(null)}
                  className="mb-6 px-4 py-2 rounded-full border border-[var(--line)] bg-[var(--surface)] text-xs font-mono hover:bg-[var(--surface-2)] flex items-center gap-2"
                >
                  ← Return to Focus Wheel
                </button>
                <h2 className="text-2xl font-bold mb-2 flex items-center gap-3">
                  <span className="w-4 h-4 rounded-full" style={{ backgroundColor: activeCategory.color }} />
                  {activeCategory.label} Page
                </h2>
                <p className="text-sm text-[var(--muted)] mb-8">{activeCategory.description}</p>

                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                  {projects
                    .filter((p) => p.categoryId === activeCategory.id)
                    .map((project) => (
                      <div
                        key={project.id}
                        onClick={() => setSelectedProject(project)}
                        className="border border-[var(--line)] bg-[var(--surface)] rounded-lg overflow-hidden cursor-pointer hover:border-white/40 transition-all group"
                      >
                        <div className="aspect-video bg-[var(--surface-2)] overflow-hidden">
                          <img src={project.cover} alt={project.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                        </div>
                        <div className="p-4">
                          <h4 className="font-bold text-base mb-1">{project.title}</h4>
                          <p className="text-xs text-[var(--muted)] line-clamp-2">{project.desc}</p>
                        </div>
                      </div>
                    ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
